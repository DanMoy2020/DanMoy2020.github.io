<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaggle | Events</title>
  <meta name="description" content="Upcoming gigs and events for Gaggle.">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="events" data-menu-default="open">
  <div id="site-header"></div>

  <main class="page">
    <section class="panel">
      <h1>Events</h1>
      <p>Add new events by duplicating any <strong>event-item</strong> block below and editing location, date/time, and ticket link.</p>
    </section>

    <section class="events-list">
      <article class="event-item">
        <h3>Venue Name, City</h3>
        <p class="event-meta">Friday, 20 March 2026 · 19:30</p>
        <a class="ticket-link" href="#" target="_blank" rel="noopener noreferrer">Ticket link</a>
      </article>

      <article class="event-item">
        <h3>Venue Name, City</h3>
        <p class="event-meta">Saturday, 18 April 2026 · 20:00</p>
        <a class="ticket-link" href="#" target="_blank" rel="noopener noreferrer">Ticket link</a>
      </article>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="script.js"></script>
</body>
</html>
