<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaggle | About</title>
  <meta name="description" content="About Gaggle and band members.">
  <link rel="icon" type="image/x-icon" href="/assets/goose.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="about" data-menu-default="open">
  <div id="site-header"></div>

  <main class="page">
    <section class="panel">
      <h1>About Gaggle</h1>
      <p>
        Sheffields finest (and first) 'lovesick loser' band.
      </p>
    </section>

    <section class="panel">
      <h2>Band Members</h2>
      <div class="member-grid">
        <article class="member-card">
          <img class="member-photo" src="/assets/images/Gaggle JArthur_Pictures-06(1).jpg" alt="Dan Moy photo">
          <div>
            <h3>Dan Moy</h3>
            <p class="member-role">Lead Singer</p>
          </div>
        </article>
        <article class="member-card">
          <img class="member-photo" src="/assets/images/Gaggle JArthur_Pictures-07(1).jpg" alt="Ed Cochrane photo">
          <div>
            <h3>Ed Cochrane</h3>
            <p class="member-role">Backing Vocals / Rhythm Guitar</p>
          </div>
        </article>
        <article class="member-card">
          <img class="member-photo" src="/assets/images/Gaggle JArthur_Pictures-09(1).jpg" alt="Will Luddington photo">
          <div>
            <h3>Will Luddington</h3>
            <p class="member-role">Bass Guitar</p>
          </div>
        </article>
        <article class="member-card">
          <img class="member-photo" src="/assets/images/Gaggle JArthur_Pictures-30(1).jpg" alt="James Garner photo">
          <div>
            <h3>James Garner</h3>
            <p class="member-role">Lead Guitar</p>
          </div>
        </article>
        <article class="member-card">
          <img class="member-photo" src="/assets/images/Gaggle JArthur_Pictures-17(1).jpg" alt="Jonah McDonell photo">
          <div>
            <h3>Jonah McDonell</h3>
            <p class="member-role">Drums</p>
          </div>
        </article>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="/script.js"></script>
</body>
</html>
